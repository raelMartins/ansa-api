services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ansa
      POSTGRES_PASSWORD: ansa
      POSTGRES_DB: ansa_dev
    ports:
      - "5432:5432"
    volumes:
      - ansa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansa -d ansa_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ansa_pg:
